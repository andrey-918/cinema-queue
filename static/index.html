<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema queue</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --surface: #ffffff;
        --surface-2: #f0f2f7;
        --border: rgba(16, 24, 40, 0.12);
        --text: #0f172a;
        --text-muted: rgba(15, 23, 42, 0.62);

        --accent: #2563eb; /* blue */
        --danger: #dc2626;

        --available: #f2f4f8;
        --available-border: rgba(15, 23, 42, 0.12);
        --available-hover: #e8edf5;

        --held-mine: #d97706; /* amber */
        --held-other: #ea580c; /* orange */
        --confirmed: #b91c1c; /* red */
        --font: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 1.25rem;
      }

      header {
        max-width: 1100px;
        margin: 0 auto 1.25rem auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding-bottom: 0.9rem;
        border-bottom: 1px solid var(--border);
      }

      header h1 {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .user-id {
        font-size: 0.75rem;
        color: var(--text-muted);
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 0.35rem 0.6rem;
        border-radius: 8px;
        white-space: nowrap;
      }

      .movies {
        max-width: 1100px;
        margin: 0 auto 1.25rem auto;
        display: flex;
        gap: 0.9rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .movie-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.95rem 1.05rem;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
        min-width: 180px;
        text-align: center;
      }

      .movie-card:hover {
        background: var(--surface-2);
        border-color: rgba(37, 99, 235, 0.35);
        box-shadow: 0 6px 16px rgba(2, 6, 23, 0.06);
      }

      .movie-card.selected {
        border-color: rgba(37, 99, 235, 0.6);
        background: var(--surface-2);
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.12);
      }

      .movie-card h3 {
        font-size: 0.95rem;
        margin-bottom: 0.25rem;
        line-height: 1.2;
      }

      .movie-card p {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .content {
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        gap: 1.25rem;
        align-items: flex-start;
        flex-wrap: wrap;
        justify-content: center;
      }

      .screen-area {
        flex: 1;
        min-width: 320px;
        max-width: 800px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
      }

      .screen-label {
        text-align: center;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--text-muted);
        margin-bottom: 0.65rem;
      }

      .screen-bar {
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(37, 99, 235, 0.65),
          transparent
        );
        border-radius: 2px;
        margin: 0 2rem 1.2rem;
      }

      .seat-grid {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.45rem;
        padding: 0.25rem 0;
      }

      .seat-row {
        display: flex;
        gap: 0.42rem;
        align-items: center;
        justify-content: center;
      }

      .row-label {
        width: 1.25rem;
        font-size: 0.7rem;
        color: var(--text-muted);
        text-align: center;
      }

      .seat {
        width: 34px;
        height: 30px;
        border-radius: 7px 7px 4px 4px;
        border: 1px solid var(--available-border);
        cursor: pointer;
        font-size: 0.65rem;
        font-family: var(--font);
        color: rgba(15, 23, 42, 0.55);
        background: var(--available);
        transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      }

      .seat:hover:not(.seat--held-mine):not(.seat--held-other):not(
          .seat--confirmed
        ) {
        background: var(--available-hover);
        border-color: rgba(37, 99, 235, 0.35);
        box-shadow: 0 10px 22px rgba(37, 99, 235, 0.10);
      }

      .seat--held-mine {
        background: rgba(217, 119, 6, 0.95);
        border-color: rgba(217, 119, 6, 0.95);
        color: #ffffff;
        cursor: default;
      }

      .seat--held-other {
        background: rgba(234, 88, 12, 0.95);
        border-color: rgba(234, 88, 12, 0.95);
        color: #ffffff;
        cursor: not-allowed;
      }

      .seat--confirmed {
        background: rgba(185, 28, 28, 0.95);
        border-color: rgba(185, 28, 28, 0.95);
        color: #ffffff;
        cursor: not-allowed;
      }

      .legend {
        display: flex;
        gap: 0.9rem;
        justify-content: center;
        margin-top: 1rem;
        flex-wrap: wrap;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .legend-swatch {
        width: 14px;
        height: 12px;
        border-radius: 3px 3px 2px 2px;
        border: 1px solid rgba(0, 0, 0, 0.05);
      }

      #checkoutArea {
        width: 320px;
      }

      .checkout {
        width: 320px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
      }

      .checkout h3 {
        font-size: 0.9rem;
        margin-bottom: 0.85rem;
        color: var(--accent);
        font-weight: 800;
      }

      .checkout-info {
        font-size: 0.85rem;
        margin-bottom: 0.45rem;
      }

      .checkout-info span {
        color: var(--text-muted);
        margin-right: 0.25rem;
      }

      .timer {
        font-size: 1.6rem;
        font-weight: 800;
        text-align: center;
        margin: 0.75rem 0 0.75rem;
        color: var(--held-mine);
      }

      .timer.urgent {
        color: var(--danger);
      }

      .checkout-buttons {
        display: flex;
        gap: 0.6rem;
      }

      .btn {
        flex: 1;
        padding: 0.55rem 0.65rem;
        border: 1px solid transparent;
        border-radius: 10px;
        font-family: var(--font);
        font-size: 0.85rem;
        font-weight: 800;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.06s, box-shadow 0.15s;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn:hover {
        opacity: 0.92;
        box-shadow: 0 10px 20px rgba(2, 6, 23, 0.08);
      }

      .btn--confirm {
        background: #16a34a;
        color: #ffffff;
      }

      .btn--release {
        background: var(--danger);
        color: #ffffff;
      }

      .status-msg {
        text-align: center;
        margin-top: 0.75rem;
        font-size: 0.85rem;
        font-weight: 900;
      }

      .status-msg.success {
        color: #16a34a;
      }
      .status-msg.error {
        color: var(--danger);
      }

      @media (max-width: 820px) {
        header {
          padding-bottom: 0.75rem;
        }

        .movies {
          margin-bottom: 1rem;
        }

        .content {
          gap: 1rem;
        }

        .screen-area {
          min-width: 0;
        }

        #checkoutArea {
          width: 100%;
        }

        .checkout {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Бронирование билетов</h1>
      <div class="user-id" id="userBadge"></div>
    </header>

    <div class="movies" id="movieList"></div>

    <div class="content" id="mainContent" style="display: none">
      <div class="screen-area">
        <div class="screen-label">Экран</div>
        <div class="screen-bar"></div>
        <div class="seat-grid" id="seatGrid"></div>
        <div class="legend">
          <div class="legend-item">
            <div
              class="legend-swatch"
              style="background: var(--available)"
            ></div>
            Свободно
          </div>
          <div class="legend-item">
            <div
              class="legend-swatch"
              style="background: var(--held-mine)"
            ></div>
            Вы выбрали
          </div>
          <div class="legend-item">
            <div
              class="legend-swatch"
              style="background: var(--held-other)"
            ></div>
            В процессе бронирования
          </div>
          <div class="legend-item">
            <div
              class="legend-swatch"
              style="background: var(--confirmed)"
            ></div>
            Занято
          </div>
        </div>
      </div>
      <div id="checkoutArea"></div>
    </div>

    <script>
      (function () {
        const userID = crypto.randomUUID().replace(/-/g, "").slice(0, 12);
        document.getElementById("userBadge").textContent = "user: " + userID;

        let movies = [];
        let selectedMovie = null;
        let activeSession = null; // { sessionID, movieID, seatID, expiresAt }
        let pollInterval = null;
        let timerInterval = null;

        // --- API helpers ---

        function api(method, path, body) {
          const opts = {
            method,
            headers: { "Content-Type": "application/json" },
          };
          if (body) opts.body = JSON.stringify(body);
          return fetch(path, opts).then(function (r) {
            if (r.status === 204) return null;
            return r.json().then(function (data) {
              if (!r.ok) throw new Error(data.error || "request failed");
              return data;
            });
          });
        }

        // --- Movie list ---

        function loadMovies() {
          api("GET", "/movies").then(function (data) {
            movies = data;
            renderMovies();
          });
        }

        function renderMovies() {
          var container = document.getElementById("movieList");
          container.innerHTML = "";
          movies.forEach(function (m) {
            var card = document.createElement("div");
            card.className =
              "movie-card" +
              (selectedMovie && selectedMovie.id === m.id ? " selected" : "");
            card.innerHTML =
              "<h3>" +
              escapeHtml(m.title) +
              "</h3><p>" +
              m.rows +
              " рядов &times; " +
              m.seats_per_row +
              " мест</p>";
            card.addEventListener("click", function () {
              selectMovie(m);
            });
            container.appendChild(card);
          });
        }

        function releaseActiveSession() {
          if (!activeSession) return Promise.resolve();
          var sid = activeSession.sessionID;
          clearTimerInterval();
          activeSession = null;
          document.getElementById("checkoutArea").innerHTML = "";
          return api("DELETE", "/sessions/" + sid, { user_id: userID }).catch(
            function () {},
          );
        }

        function selectMovie(movie) {
          releaseActiveSession();
          selectedMovie = movie;
          renderMovies();
          document.getElementById("mainContent").style.display = "flex";
          document.getElementById("checkoutArea").innerHTML = "";
          fetchSeats();
          startPolling();
        }

        // --- Seat grid ---

        function fetchSeats() {
          if (!selectedMovie) return;
          api("GET", "/movies/" + selectedMovie.id + "/seats").then(
            function (seats) {
              renderGrid(seats);
            },
          );
        }

        function renderGrid(seatStatuses) {
          var grid = document.getElementById("seatGrid");
          grid.innerHTML = "";
          var statusMap = {};
          seatStatuses.forEach(function (s) {
            statusMap[s.seat_id] = s;
          });

          var rowLabels = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
          for (var r = 0; r < selectedMovie.rows; r++) {
            var rowDiv = document.createElement("div");
            rowDiv.className = "seat-row";
            var label = document.createElement("div");
            label.className = "row-label";
            label.textContent = rowLabels[r];
            rowDiv.appendChild(label);

            for (var s = 1; s <= selectedMovie.seats_per_row; s++) {
              var seatID = rowLabels[r] + s;
              var btn = document.createElement("button");
              btn.className = "seat";
              btn.textContent = s;
              btn.dataset.seatId = seatID;

              var info = statusMap[seatID];
              if (info) {
                if (info.confirmed) {
                  btn.classList.add("seat--confirmed");
                } else if (info.booked && info.user_id === userID) {
                  btn.classList.add("seat--held-mine");
                } else if (info.booked) {
                  btn.classList.add("seat--held-other");
                }
              }

              (function (id) {
                btn.addEventListener("click", function () {
                  holdSeat(id);
                });
              })(seatID);

              rowDiv.appendChild(btn);
            }

            var labelRight = document.createElement("div");
            labelRight.className = "row-label";
            labelRight.textContent = rowLabels[r];
            rowDiv.appendChild(labelRight);
            grid.appendChild(rowDiv);
          }
        }

        // --- Hold / Confirm / Release ---

        function holdSeat(seatID) {
          if (activeSession) return;
          api(
            "POST",
            "/movies/" + selectedMovie.id + "/seats/" + seatID + "/hold",
            { user_id: userID },
          )
            .then(function (data) {
              activeSession = {
                sessionID: data.session_id,
                movieID: data.movie_id,
                seatID: data.seat_id,
                expiresAt: new Date(data.expires_at),
              };
              fetchSeats();
              renderCheckout();
              startTimer();
            })
            .catch(function (err) {
              showCheckoutStatus("Это место нельзя выбрать", "error");
            });
        }

        function confirmSeat() {
          if (!activeSession) return;
          api("PUT", "/sessions/" + activeSession.sessionID + "/confirm", {
            user_id: userID,
          })
            .then(function () {
              clearTimerInterval();
              activeSession = null;
              fetchSeats();
              showCheckoutStatus("Забронировано!", "success");
            })
            .catch(function (err) {
              showCheckoutStatus(err.message, "error");
            });
        }

        function releaseSeat() {
          if (!activeSession) return;
          api("DELETE", "/sessions/" + activeSession.sessionID, {
            user_id: userID,
          })
            .then(function () {
              clearTimerInterval();
              activeSession = null;
              fetchSeats();
              document.getElementById("checkoutArea").innerHTML = "";
            })
            .catch(function (err) {
              showCheckoutStatus(err.message, "error");
            });
        }

        // --- Checkout panel ---

        function renderCheckout() {
          if (!activeSession) return;
          var area = document.getElementById("checkoutArea");
          area.innerHTML =
            '<div class="checkout">' +
            "<h3>Бронирование</h3>" +
            '<div class="checkout-info"><span>Место:</span> ' +
            escapeHtml(activeSession.seatID) +
            "</div>" +
            '<div class="checkout-info"><span>Фильм:</span> ' +
            selectedMovie.title +
            "</div>" +
            '<div class="checkout-info"><span>Номер заказа:</span> ' +
            activeSession.sessionID.slice(0, 8) +
            "&hellip;</div>" +
            '<div class="timer" id="timer">--:--</div>' +
            '<div class="checkout-buttons">' +
            '<button class="btn btn--confirm" id="btnConfirm">Подтвердить</button>' +
            '<button class="btn btn--release" id="btnRelease">Отменить</button>' +
            "</div>" +
            '<div id="checkoutStatus"></div>' +
            "</div>";
          document
            .getElementById("btnConfirm")
            .addEventListener("click", confirmSeat);
          document
            .getElementById("btnRelease")
            .addEventListener("click", releaseSeat);
        }

        function showCheckoutStatus(msg, type) {
          var area = document.getElementById("checkoutArea");
          area.innerHTML =
            '<div class="checkout">' +
            '<div class="status-msg ' +
            type +
            '">' +
            escapeHtml(msg) +
            "</div>" +
            "</div>";
          setTimeout(function () {
            if (!activeSession) area.innerHTML = "";
          }, 3000);
        }

        // --- Timer ---

        function startTimer() {
          clearTimerInterval();
          updateTimer();
          timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
          if (!activeSession) {
            clearTimerInterval();
            return;
          }
          var el = document.getElementById("timer");
          if (!el) return;
          var remaining = Math.max(
            0,
            Math.floor((activeSession.expiresAt - Date.now()) / 1000),
          );
          var mins = Math.floor(remaining / 60);
          var secs = remaining % 60;
          el.textContent =
            String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");

          if (remaining < 60) {
            el.classList.add("urgent");
          } else {
            el.classList.remove("urgent");
          }

          if (remaining <= 0) {
            clearTimerInterval();
            activeSession = null;
            fetchSeats();
            showCheckoutStatus("Время бронирование закончилось", "error");
          }
        }

        function clearTimerInterval() {
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
        }

        // --- Polling ---

        function startPolling() {
          if (pollInterval) clearInterval(pollInterval);
          pollInterval = setInterval(fetchSeats, 2000);
        }

        // --- Util ---

        function escapeHtml(str) {
          var div = document.createElement("div");
          div.textContent = str;
          return div.innerHTML;
        }

        // --- Init ---

        loadMovies();
      })();
    </script>
  </body>
</html>
